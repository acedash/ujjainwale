<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="advBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="50%" stop-color="#141419"/>
      <stop offset="100%" stop-color="#241708"/>
    </linearGradient>

    <radialGradient id="advGlow" cx="75%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="advBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <filter id="advShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="320" rx="20" fill="url(#advBg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#advGlow)"/>
  <rect x="1.5" y="1.5" width="1197" height="317" rx="19" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Right Visual Graphics: Abstract 3D Glowing Mega Graphic -->
  <g transform="translate(850, 160)">
    <!-- Concentric Neon Rings -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="8 8"/>
    <circle cx="0" cy="0" r="105" fill="none" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.3"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.25"/>
    <circle cx="0" cy="0" r="35" fill="#f59e0b" fill-opacity="0.1"/>

    <!-- Large 3D Icon Graphic -->
    <text x="0" y="24" font-size="90" text-anchor="middle" dominant-baseline="central">📢</text>

    <!-- Floating Accent Spheres -->
    <circle cx="110" cy="-60" r="14" fill="#fbbf24" opacity="0.6"/>
    <circle cx="-100" cy="70" r="10" fill="#f59e0b" opacity="0.5"/>
    <circle cx="90" cy="80" r="7" fill="#fef08a" opacity="0.7"/>
  </g>

  <!-- Minimal Punchy Content -->
  <g transform="translate(70, 75)">
    <!-- Small Category Pill -->
    <g transform="translate(0, 0)">
      <rect width="145" height="28" rx="14" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="16" cy="14" r="4" fill="#fbbf24"/>
      <text x="82" y="19" fill="#fef08a" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">ADVERTISE HERE</text>
    </g>

    <!-- Big Bold Title -->
    <text x="0" y="78" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#advShadow)">
      Grow Your Business Across Ujjain
    </text>

    <!-- Single Punchy Subtitle -->
    <text x="0" y="118" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="500" opacity="0.9">
      50,000+ Daily Readers • Pilgrims, Tourists &amp; Local Residents
    </text>

    <!-- Clean Sleek CTA Button -->
    <g transform="translate(0, 142)" filter="url(#advShadow)">
      <rect width="210" height="48" rx="24" fill="url(#advBtn)"/>
      <text x="105" y="30" fill="#18181b" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" text-anchor="middle" letter-spacing="0.5">
        BOOK AD BANNER →
      </text>
    </g>
  </g>
</svg>
