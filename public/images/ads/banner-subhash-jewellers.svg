<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240">
  <defs>
    <linearGradient id="jewelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0f03"/>
      <stop offset="50%" stop-color="#2d1600"/>
      <stop offset="100%" stop-color="#3d1f05"/>
    </linearGradient>

    <radialGradient id="jewelGlow" cx="80%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <filter id="jShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="240" rx="18" fill="url(#jewelBg)"/>
  <rect width="1200" height="240" rx="18" fill="url(#jewelGlow)"/>
  <rect x="1.5" y="1.5" width="1197" height="237" rx="17" fill="none" stroke="#eab308" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- Right Visual Art: Big Gem Graphic -->
  <g transform="translate(920, 120)">
    <circle cx="0" cy="0" r="90" fill="none" stroke="#eab308" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="6 6"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#facc15" stroke-width="2" stroke-opacity="0.3"/>
    <text x="0" y="20" font-size="75" text-anchor="middle" dominant-baseline="central">💎</text>
  </g>

  <!-- Content -->
  <g transform="translate(60, 48)">
    <g transform="translate(0, 0)">
      <rect width="145" height="26" rx="13" fill="#ca8a04" fill-opacity="0.2" stroke="#eab308" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="14" cy="13" r="3.5" fill="#facc15"/>
      <text x="82" y="17" fill="#fef08a" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1">SPECIAL SPONSOR</text>
    </g>

    <!-- Big Title -->
    <text x="0" y="68" fill="url(#goldLinear)" font-family="system-ui, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.5" filter="url(#jShadow)">
      सुभाष ज्वेलर्स • सराफा बाजार, उज्जैन
    </text>

    <!-- Short Tagline -->
    <text x="0" y="102" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="16" font-weight="500" opacity="0.9">
      100% BIS हॉलमार्क शुद्ध स्वर्ण एवं हीरक आभूषण • 50 वर्षों का अटूट विश्वास
    </text>

    <!-- Button -->
    <g transform="translate(0, 122)" filter="url(#jShadow)">
      <rect width="190" height="42" rx="21" fill="url(#goldLinear)"/>
      <text x="95" y="26" fill="#1c0f03" font-family="system-ui, sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="0.5">
        VISIT SHOWROOM →
      </text>
    </g>
  </g>
</svg>
