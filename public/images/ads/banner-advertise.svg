<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="advGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#3f2305"/>
    </linearGradient>
    <linearGradient id="advBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="advShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="20" fill="url(#advGrad)"/>
  
  <!-- Subtle Grid/Pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
  </g>

  <!-- Glows -->
  <circle cx="1100" cy="160" r="150" fill="#f59e0b" opacity="0.12"/>
  <circle cx="100" cy="80" r="100" fill="#f59e0b" opacity="0.08"/>

  <!-- Left Icon Emblem -->
  <g transform="translate(60, 50)">
    <rect width="90" height="90" rx="18" fill="#27272a" stroke="#f59e0b" stroke-width="2.5" filter="url(#advShadow)"/>
    <text x="45" y="60" font-size="44" text-anchor="middle" dominant-baseline="central">📢</text>
  </g>

  <!-- Badge -->
  <g transform="translate(170, 50)">
    <rect width="180" height="26" rx="6" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="90" y="18" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">ADVERTISE ON UJJAINWALE</text>
  </g>

  <!-- Main Headline -->
  <text x="170" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
    Grow Your Business Across Ujjain &amp; Malwa
  </text>

  <!-- Subtitle -->
  <text x="170" y="170" fill="#fef08a" font-family="system-ui, sans-serif" font-size="17" font-weight="600">
    Connect with 50,000+ local readers, pilgrims, business owners &amp; tourists daily.
  </text>
  <text x="170" y="200" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="14" font-weight="400">
    Prime Billboard Banners (1200×320), In-Feed Ads, Directory Listings &amp; Social Promotion.
  </text>

  <!-- Stats Pills -->
  <g transform="translate(170, 235)">
    <rect width="140" height="34" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>
    <text x="70" y="22" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚡ High CTR Views</text>
  </g>
  <g transform="translate(325, 235)">
    <rect width="165" height="34" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>
    <text x="82" y="22" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🎯 100% Local Ujjain Reach</text>
  </g>

  <!-- Right Call To Action Section -->
  <g transform="translate(860, 90)">
    <text x="150" y="20" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">AD ENQUIRY &amp; RATES</text>
    <text x="150" y="55" fill="#fbbf24" font-family="monospace, sans-serif" font-size="24" font-weight="900" letter-spacing="0.5" text-anchor="middle">+91 98270 11111</text>
    
    <g transform="translate(10, 85)" filter="url(#advShadow)">
      <rect width="280" height="52" rx="26" fill="url(#advBtn)"/>
      <text x="140" y="32" fill="#18181b" font-family="system-ui, sans-serif" font-size="15" font-weight="900" text-anchor="middle" letter-spacing="0.5">
        BOOK AD BANNER NOW →
      </text>
    </g>
  </g>
</svg>
