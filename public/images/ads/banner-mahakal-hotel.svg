<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#2a1705"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#fda085"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e65100"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative circles -->
  <circle cx="1150" cy="50" r="180" fill="#f59e0b" opacity="0.08" />
  <circle cx="50" cy="300" r="140" fill="#f59e0b" opacity="0.05" />

  <!-- Temple Silhouette Graphic (Right Side) -->
  <g opacity="0.12" transform="translate(900, 20) scale(0.65)">
    <path d="M 200 400 L 200 250 L 150 250 L 175 160 L 140 160 L 200 40 L 260 160 L 225 160 L 250 250 L 200 250 Z" fill="#fbbf24"/>
    <path d="M 80 400 L 80 280 L 120 200 L 100 200 L 130 140 L 160 200 L 140 200 L 180 280 L 180 400 Z" fill="#fbbf24"/>
    <path d="M 320 400 L 320 280 L 280 200 L 300 200 L 270 140 L 240 200 L 260 200 L 220 280 L 220 400 Z" fill="#fbbf24"/>
  </g>

  <!-- Left Icon Emblem -->
  <g transform="translate(60, 50)">
    <rect width="90" height="90" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="45" y="62" font-size="46" text-anchor="middle" dominant-baseline="central">🛕</text>
  </g>

  <!-- Badges Top Left -->
  <g transform="translate(170, 50)">
    <rect width="115" height="26" rx="6" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="57" y="18" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">AD • प्रायोजक</text>
  </g>
  <g transform="translate(295, 50)">
    <rect width="210" height="26" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.2"/>
    <text x="105" y="18" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">★ 4.9 (850+ Google Reviews)</text>
  </g>

  <!-- Main Headline -->
  <text x="170" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
    श्री महाकाल हेरिटेज होटल एवं धर्मशाला · उज्जैन
  </text>

  <!-- Subtitle / Highlights -->
  <text x="170" y="170" fill="#fef08a" font-family="system-ui, sans-serif" font-size="17" font-weight="600">
    महाकाल मंदिर से मात्र २०० मीटर दूरी पर • २४/७ एसी डीलक्स रूम्स • शुद्ध सात्विक भोजन • लिफ्ट सुविधा
  </text>
  <text x="170" y="200" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="400">
    भस्म आरती दर्शन बुकिंग सहायता, वीआईपी दर्शन व मंगलनाथ कालसर्प पूजा मार्गदर्शन उपलब्ध।
  </text>

  <!-- Offer Tagline -->
  <g transform="translate(170, 235)">
    <rect width="320" height="34" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>
    <text x="160" y="22" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
      Special Pilgrim Rate: ₹999/- से शुरू
    </text>
  </g>

  <!-- Right Call To Action Section -->
  <g transform="translate(860, 90)">
    <!-- Call Box -->
    <text x="150" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">24x7 HELPLINE &amp; BOOKING</text>
    <text x="150" y="55" fill="#fbbf24" font-family="monospace, sans-serif" font-size="24" font-weight="900" letter-spacing="0.5" text-anchor="middle">+91 98270 12345</text>
    
    <!-- CTA Button -->
    <g transform="translate(10, 85)" filter="url(#shadow)">
      <rect width="280" height="52" rx="26" fill="url(#btnGrad)"/>
      <text x="140" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="900" text-anchor="middle" letter-spacing="0.5">
        BOOK ROOM NOW →
      </text>
    </g>
  </g>
</svg>
